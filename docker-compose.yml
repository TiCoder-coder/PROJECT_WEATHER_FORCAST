services:
  mongodb:
    image: mongo:7.0
    container_name: weather_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-weatherpass123}
      MONGO_INITDB_DATABASE: weather_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - weather_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weather_app
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_ROOT_PASSWORD:-weatherpass123}@mongodb:27017/weather_db?authSource=admin
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-your-secret-key-here}
      DEBUG: ${DEBUG:-True}
    volumes:
      - ./data:/app/data
      - ./Weather_Forcast_App/Machine_learning_artifacts:/app/Weather_Forcast_App/Machine_learning_artifacts
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - weather_network

volumes:
  mongodb_data:

networks:
  weather_network:
    driver: bridge
